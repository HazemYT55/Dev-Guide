# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run the workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload entire repository
          path: '.'
      # Workaround for https://github.com/actions/deploy-pages/issues/451:
      # deploy-pages looks up the artifact once, and it may not be listed
      # immediately after upload. Retry only the deploy, never the upload
      # (a second upload makes the lookup fail with multiple artifacts).
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        continue-on-error: true
      - name: Wait before retrying deploy
        if: steps.deployment.outcome == 'failure'
        run: sleep 5
      - name: Deploy to GitHub Pages (retry 1)
        id: deployment_retry_1
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5
        continue-on-error: true
      - name: Wait before retrying deploy
        if: steps.deployment_retry_1.outcome == 'failure'
        run: sleep 20
      - name: Deploy to GitHub Pages (retry 2)
        id: deployment_retry_2
        if: steps.deployment_retry_1.outcome == 'failure'
        uses: actions/deploy-pages@v5
        continue-on-error: true
      - name: Wait before retrying deploy
        if: steps.deployment_retry_2.outcome == 'failure'
        run: sleep 60
      - name: Deploy to GitHub Pages (retry 3)
        id: deployment_retry_3
        if: steps.deployment_retry_2.outcome == 'failure'
        uses: actions/deploy-pages@v5
